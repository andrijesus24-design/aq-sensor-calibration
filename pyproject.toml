[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqcal"
version = "0.1.0"
description = "Quality assurance and calibration of low-cost PM2.5 sensors against reference monitors"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
aqcal = "aqcal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
